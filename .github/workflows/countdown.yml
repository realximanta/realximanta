name: Countdown Updater

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update days remaining
        run: |
          TARGET=$(date -u -d "2027-01-01 00:00:00" +%s)
          NOW=$(date -u +%s)
          DAYS=$(( (TARGET - NOW) / 86400 ))
          if [ "$DAYS" -lt 0 ]; then DAYS=0; fi
          
          # FIXED: Now replaces XX OR any existing number
          sed -i -E "s/DAYS%20REMAINING-[A-Za-z0-9]+/DAYS%20REMAINING-${DAYS}/g" README.md

      - name: Commit and push
        run: |
          git config user.name  "countdown-bot"
          git config user.email "countdown-bot@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: update countdown [skip ci]"
            git push
          fi
