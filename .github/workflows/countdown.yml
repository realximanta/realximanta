name: Countdown Updater

on:
  schedule:
    # 18:45 UTC is 12:15 AM IST (Runs just after midnight your time)
    - cron: '45 18 * * *'   
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update days remaining
        run: |
          TARGET_DATE="2027-01-01"
          
          # FORCE the script to use IST (Asia/Kolkata) for today's date
          NOW_DATE=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          
          # Calculate exact calendar days difference
          DAYS=$(( ($(date -d "$TARGET_DATE" +%s) - $(date -d "$NOW_DATE" +%s)) / 86400 ))
          
          if [ "$DAYS" -lt 0 ]; then DAYS=0; fi
          
          echo "Today in IST is: $NOW_DATE"
          echo "Days remaining: $DAYS"
          
          # Update the README
          sed -i -E "s/DAYS%20REMAINING-[A-Za-z0-9]+/DAYS%20REMAINING-${DAYS}/g" README.md

      - name: Commit and push
        run: |
          git config user.name  "countdown-bot"
          git config user.email "countdown-bot@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No change needed. Date is already correct."
          else
            git commit -m "chore: update countdown [skip ci]"
            git push
          fi
