name: Countdown Updater

on:
  schedule:
    - cron: '30 14 * * *'   # Runs at 8:00 PM IST (14:30 UTC) - No more delays!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update days remaining
        run: |
          # Define target date and today's date in UTC
          TARGET_DATE="2027-01-01"
          NOW_DATE=$(date -u +%Y-%m-%d)
          
          # Calculate exact calendar days difference
          DAYS=$(( ($(date -u -d "$TARGET_DATE" +%s) - $(date -u -d "$NOW_DATE" +%s)) / 86400 ))
          
          if [ "$DAYS" -lt 0 ]; then DAYS=0; fi
          
          # Update the README
          sed -i -E "s/DAYS%20REMAINING-[A-Za-z0-9]+/DAYS%20REMAINING-${DAYS}/g" README.md

      - name: Commit and push
        run: |
          git config user.name  "countdown-bot"
          git config user.email "countdown-bot@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: update countdown [skip ci]"
            git push
          fi
